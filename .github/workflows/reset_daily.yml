name: Reset Daily Cron Schedule

on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:

jobs:
  reset-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Reset daily schedules
        run: |
          curl -f -X GET "https://apiv2.scrumb.in/discord/reset_daily_cron_schedule/" \
          -H "X-CRON-API-KEY: ${{ secrets.CRON_API_KEY }}"
