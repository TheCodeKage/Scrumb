services:
  postgres:
    image: postgres:16
    container_name: scrumb_postgres
    restart: always

    environment:
      POSTGRES_DB: scrumb
      POSTGRES_USER: scrumb_user
      POSTGRES_PASSWORD: strongpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: